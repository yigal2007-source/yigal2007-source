<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.className='js'</script>
<title>Yigal Amiel Benggu – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Sora:wght@300;500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#fbf8f1; --panel:#fffdf8; --line:#e6d9b8;
  --blue:#b8892b; --cyan:#8a6418; --violet:#d9b86a;
  --text:#2a2114; --muted:#6b5f49;
  --head:'Sora','Segoe UI',system-ui,sans-serif; --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--void);color:var(--text);font:400 1.05rem/1.7 var(--body);overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 45% at 80% 10%,rgba(217,184,106,.28),transparent 70%),
             radial-gradient(50% 40% at 10% 90%,rgba(240,222,176,.45),transparent 70%)}
main,footer{position:relative;z-index:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}

/* Navbar */
nav{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 20px);
  background:rgba(255,252,244,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(184,137,43,.55);
  box-shadow:0 0 12px rgba(212,175,55,.5),0 0 36px rgba(212,175,55,.28),inset 0 0 14px rgba(212,175,55,.12);
  animation:navGlow 4s ease-in-out infinite}
@keyframes navGlow{50%{box-shadow:0 0 18px rgba(230,195,90,.7),0 0 52px rgba(212,175,55,.4),inset 0 0 18px rgba(212,175,55,.18)}}
nav a{text-decoration:none;font:500 .88rem/1 var(--head);color:var(--muted);padding:11px 16px;border-radius:999px;transition:color .2s,background .2s,text-shadow .2s;white-space:nowrap}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);background:rgba(184,137,43,.18)}

section{padding:110px 24px;max-width:1040px;margin:0 auto}
h2{font:700 clamp(1.8rem,4vw,2.5rem)/1.15 var(--head);margin:0 0 40px;letter-spacing:-.02em}

/* Hero */
#beranda{min-height:100svh;display:grid;place-items:center;text-align:center;padding-top:120px;position:relative;max-width:none}
.planet{position:absolute;width:min(46vw,380px);aspect-ratio:1;right:6%;bottom:8%;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff3c9 0%,#dcb552 38%,#9a6f1c 72%,#5a3f0f 100%);
  box-shadow:0 0 60px rgba(212,175,55,.35),inset -30px -20px 60px rgba(70,45,5,.45);
  animation:float 9s ease-in-out infinite;opacity:.85}
.planet::before,.planet::after{content:"";position:absolute;left:-30%;right:-30%;top:40%;bottom:40%;
  border:2px solid rgba(184,137,43,.55);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 14px rgba(212,175,55,.3)}
.planet::after{left:-48%;right:-48%;top:36%;bottom:36%;border-color:rgba(217,184,106,.5);transform:rotate(-18deg)}
@keyframes float{50%{transform:translateY(-22px)}}
.hero-in{position:relative;padding:0 20px}
.hero-in>*{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-in>*:nth-child(2){animation-delay:.15s}.hero-in>*:nth-child(3){animation-delay:.3s}.hero-in>*:nth-child(4){animation-delay:.45s}
@keyframes rise{to{opacity:1;transform:none}}
.hi{color:var(--muted);font:500 1.1rem var(--head);margin:0 0 6px}
h1{font:800 clamp(2.6rem,10vw,6.4rem)/1 var(--head);letter-spacing:-.04em;margin:0 0 18px;
  background:linear-gradient(180deg,#3a2c0e 25%,#b8892b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(184,137,43,.3))}
.role{font:500 clamp(1.2rem,4vw,2rem) var(--head);min-height:1.6em;color:var(--cyan)}
.role .cur{display:inline-block;width:3px;height:1.1em;background:var(--cyan);margin-left:4px;vertical-align:-.15em;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--cyan)}
@keyframes blink{50%{opacity:0}}
.cta{display:inline-flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.btn{font:500 .95rem var(--head);padding:14px 26px;border-radius:999px;text-decoration:none;border:1px solid var(--blue);transition:box-shadow .25s,transform .25s}
.btn.fill{background:linear-gradient(135deg,#e3c274,#b8892b);color:#1c1505}
.btn:hover{box-shadow:0 0 24px rgba(212,175,55,.65);transform:translateY(-2px)}

/* About */
.about{display:grid;grid-template-columns:280px 1fr;gap:56px;align-items:start}
.photo{position:relative;width:260px;aspect-ratio:1;margin:0 auto}
.photo .ring{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(184,137,43,.6);animation:spin 28s linear infinite}
.photo .ring::after{content:"";position:absolute;top:6%;left:50%;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}
.photo .pic{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#fff,#efe3c4 75%);border:3px solid #d4af37;box-shadow:0 0 36px rgba(212,175,55,.45)}
.photo .pic span{font:800 4.4rem var(--head);color:#cfe0ff;text-shadow:0 0 24px var(--blue)}
.photo .pic img{width:100%;height:100%;object-fit:cover}
.about p{color:var(--muted);margin:0 0 18px;max-width:62ch}
.about p strong{color:var(--text);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.stat{padding:18px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.75);text-align:center}
.stat b{display:block;font:800 2rem/1.1 var(--head);color:var(--cyan);text-shadow:0 0 14px rgba(212,175,55,.35)}
.stat small{color:var(--muted);font-size:.85rem}

/* Timeline */
.tl{position:relative;margin:0;padding:0 0 0 30px;list-style:none;border-left:1px solid var(--line)}
.tl li{position:relative;padding-bottom:34px}
.tl li::before{content:"";position:absolute;left:-36px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px var(--blue)}
.tl time{font:500 .85rem var(--head);color:var(--cyan)}
.tl h3{font:700 1.2rem var(--head);margin:4px 0 4px}
.tl p{margin:0;color:var(--muted);max-width:64ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.cols h2{font-size:1.6rem}

/* Contact */
#kontak{text-align:center}
#kontak p{color:var(--muted);max-width:50ch;margin:-20px auto 28px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 20px calc(40px + env(safe-area-inset-bottom,0px))}

@media(max-width:820px){
  section{padding:84px 20px}
  .about,.cols{grid-template-columns:1fr;gap:40px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .planet{opacity:.35;right:-12%}
  nav a{padding:10px 11px;font-size:.78rem}
}
h1,h2,.tl h3,.stat b{font-family:'Cormorant Garamond',Georgia,serif}
h1{font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(2.2rem,5vw,3rem);font-weight:600}
.cols h2{font-size:2.1rem}
.tl h3{font-size:1.5rem;font-weight:600}
.stat b{font-size:2.4rem;font-weight:700}
html.js section[id]:not(.on){display:none!important}
section.on{animation:pageIn .65s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(28px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
main{min-height:100svh}
.kontak-list{display:grid;gap:14px;max-width:460px;margin:0 auto;text-align:left}
.kontak-list a{display:flex;flex-direction:column;gap:2px;padding:16px 22px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.75);text-decoration:none;transition:box-shadow .25s,transform .25s,border-color .25s}
.kontak-list a:hover{border-color:var(--blue);box-shadow:0 0 22px rgba(212,175,55,.45);transform:translateY(-2px)}
.kontak-list small{color:var(--muted);font-size:.85rem}
.kontak-list span{font:500 1.1rem var(--body);color:var(--text);overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.hero-in>*{opacity:1;transform:none}}
</style>
</head>
